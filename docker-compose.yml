services:
  workshopmanagement:
    build:
      context: .
      dockerfile: Workshopmanagement/Dockerfile
    container_name: workshopmanagement-app
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - WebClientCulture=it-IT
      - MongoServerAddress=bigboi-pc.local
      - MongoServerPort=27017
      - MongoDatabase=WorkshopManager
      - ApplicationName=WorkshopManagement
      - AllowInsecureTls=false
      - IsBeta=false
      - ImageBasePath=/app/data/images
      - TemplateBasePath=Templates
      - TemplateSavePath=/app/data/templates
    volumes:
      - /run/media/simone/15763f6d-3942-4b99-af3a-f8073fc1f67b/WorkshopManagment/images:/app/data/images
      - /run/media/simone/15763f6d-3942-4b99-af3a-f8073fc1f67b/WorkshopManagment/templates:/app/data/templates
    restart: unless-stopped
