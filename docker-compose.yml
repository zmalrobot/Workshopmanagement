services:
  workshopmanagement:
    build:
      context: .
      dockerfile: Workshopmanagement/Dockerfile
    container_name: workshopmanagement-app
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - WebClientCulture=it-IT
      - MongoServerAddress=webhost.local
      - MongoServerPort=27017
      - MongoDatabase=WorkshopManager
      - ApplicationName=WorkshopManagement
      - AllowInsecureTls=false
      - IsBeta=false
      - ImageBasePath=/app/data/images
      - TemplateBasePath=Templates
      - TemplateSavePath=/app/data/templates
    volumes:
      - /home/webhost/Documenti/WorkshopManagment/images:/app/data/images
      - /home/webhost/Documenti/WorkshopManagment/templates:/app/data/templates
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: workshopmanagement-mongo
    ports:
      - "27017:27017"
    volumes:
      - /home/webhost/Documenti/WorkshopManagment/mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
